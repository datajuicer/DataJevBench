name: Repository checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12']
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install .
      - run: python scripts/check_repo.py
      - name: Check installed manifest and scorer
        run: >-
          python -I -c "from datajevbench.core import RELEASE, SCORER, read_json, sha256;
          m = read_json(RELEASE / 'manifest.json');
          assert m['version'] == '0.5';
          assert m['files']['contract.py']['sha256'] == sha256(SCORER)"
